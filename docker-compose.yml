# QQ2 机器人 + NapCat 一键部署（NAS, Docker Compose）
# 用法：
#   1) 把 qqbot-config.yml 放到本目录并编辑（密钥/白名单/人设/onebot_ws 全在这里）
#      NAS上记得把 onebot_ws 改成 ws://napcat:6700?access_token=xxx（与NapCat一致）
#   2) docker compose up -d napcat   → 打开 http://NAS_IP:6099 首次扫码登录QQ并配好OneBot
#   3) docker compose up -d --build qqbot
services:
  napcat:
    image: docker.1ms.run/mlikiowa/napcat-docker:latest   # 国内镜像站（你本地已有该镜像，避免再连Docker Hub）
    container_name: qq-napcat
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - NAPCAT_UID=0
      - NAPCAT_GID=0
      - ACCOUNT=3636055507   # 启动自动快速登录该QQ（首次仍需扫码一次，之后重启免扫码）
      # 快速登录密码/MD5 与 OneBot token 的真值放在同目录 .env（已被 .gitignore 忽略，不会提交）
      - NAPCAT_QUICK_PASSWORD=${NAPCAT_QUICK_PASSWORD}
      - NAPCAT_QUICK_PASSWORD_MD5=${NAPCAT_QUICK_PASSWORD_MD5}
    ports:
      - "6099:6099"   # NapCat webui（首次登录QQ扫码、改配置用）
      - "6800:6700"   # OneBot WS 宿主机6800（容器内仍6700，qqbot走内网napcat:6700；6600撞Windows保留段6567-6666已弃用）
    volumes:
      - napcat-data:/app/napcat       # NapCat配置持久化
      - napcat-config:/app/napcat/config  # OneBot/WebUI配置持久化（重建不丢WS配置）
      - napcat-qqdata:/app/.config/QQ # QQ登录态持久化（重建容器不丢登录）
      - ./transfer:/app/data          # 共享待传目录（qqbot把zip放这里，NapCat读取）
    networks:
      - qqbot

  qqbot:
    build: .
    container_name: qq-bot
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      - TZ=Asia/Shanghai
      # bot只找容器网内的 NapCat 6700端口（自动覆盖yml里的onebot_ws，不依赖你电脑的127.0.0.1）
      - QQ2_ONEBOT_WS=ws://napcat:6700?access_token=${ONEBOT_TOKEN}
      # 共享目录投递（覆盖yml的docker-cp默认值；本机直跑QQ2.py时才用yml的docker-cp）
      - QQ2_NAPCAT_CONTAINER=
      - QQ2_NAPCAT_HOST_DIR=/deliver
      - QQ2_NAPCAT_VIEW_DIR=/app/data
      - QQ2_DOWNLOAD_ROOT=/data/downloads
      # 永久记忆存档文件（成员好感度/备忘/上下文，挂载到项目memory目录，重启重建都不丢，可手动编辑）
      - QQ2_MEMORY_DIR=/app/memory
      # AI表情包目录（宿主机"表情包"文件夹挂到容器/app/emoji，只读；文件名即表情描述）
      - QQ2_EMOJI_DIR=/app/emoji
      - QQ2_REF_DIR=/app/ref
      # 抖音解析服务（独立容器 douyin_tiktok_download_api；在 .env 里填地址与Key）
      - QQ2_DOUYIN_API_BASE=${QQ2_DOUYIN_API_BASE:-}
      - QQ2_DOUYIN_API_KEY=${QQ2_DOUYIN_API_KEY:-}
      - QQ2_DOUYIN_MEDIA_DIR=${QQ2_DOUYIN_MEDIA_DIR:-}
      # 其余所有配置（key/白名单/人设/下载格式/密码…）都在 qqbot-config.yml，已挂载到容器
    volumes:
      - bot-data:/data                 # 下载缓存+日志持久化（缓存用完自删）
      - ./transfer:/deliver            # 与napcat共享的待传目录
      - ./memory:/app/memory           # 永久记忆存档目录（memory.json，重启不丢，可宿主机直接编辑）
      - ./表情包:/app/emoji:ro          # AI表情包目录（只读，文件名去扩展名=表情描述，AI自主选发）
      - ./素材图:/app/ref:ro            # 参考图素材库（只读，文件名=描述，AI生图时自选参考图）
      - ./qqbot-config.yml:/app/qqbot-config.yml:ro   # 配置只读挂载（bot 不需要写；WebUI 在 controller 那边以读写挂载）
      - ./QQ_AI_Bot.py:/app/QQ_AI_Bot.py                  # 代码挂载：PyCharm改宿主机QQ_AI_Bot.py，容器实时同步，重启即生效（开发用，免build）
      - ./douyin_dtk.py:/app/douyin_dtk.py                # 抖音解析服务客户端（与主程序一起挂载，改完重启即生效）
      - model-cache:/root/.cache/modelscope  # SenseVoice模型缓存持久化（936MB，只下一次）
      - napcat-qqdata:/app/.config/QQ  # 共享napcat的QQ数据卷（get_file返回的本地路径可直接访问）
      # 可选：与解析服务共享媒体卷，直接读文件（解析服务用 --profile downloader 启动后，取消下面注释）
      # - dtk-media:/dtk_media:ro
    networks:
      - qqbot
      - dtk_data

  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    container_name: qq-controller
    restart: unless-stopped
    depends_on:
      - napcat
    environment:
      - TZ=Asia/Shanghai
      - CTRL_ONEBOT_WS=ws://napcat:6700?access_token=${ONEBOT_TOKEN}
      - CTRL_ALLOWED_GROUPS=996930225
      - CTRL_ALLOWED_USERS=3353936945
      - CTRL_CONTAINER_AI=qq-bot
      - CTRL_CONTAINER_NAPCAT=qq-napcat
      - CTRL_CONTAINER_SELF=qq-controller
      # WebUI（配置界面）：端口与访问令牌都在 qqbot-config.yml 的 controller 段
      - CTRL_WEBUI_PORT=6650
      - CTRL_WEBUI_TOKEN=${CTRL_WEBUI_TOKEN:-}   # 留空则启动时自动生成强令牌（≥32位）并写入配置文件
      - CTRL_TOKEN_FILE=/app/webui_token.txt     # 令牌文件路径（bind mount 到项目目录，忘记令牌时查看）
    ports:
      - "6650:6650"   # WebUI 访问端口：http://NAS_IP:6650/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # 挂载Docker socket，让容器能控制宿主机Docker
      - ./qqbot-config.yml:/app/qqbot-config.yml   # 配置读写挂载（WebUI 保存需要写入；会原子替换+自动备份）
      - ./QQ_Controller.py:/app/QQ_Controller.py      # 代码挂载：改完重启容器即生效（免build）
      - ./webui-dashboard.html:/app/webui-dashboard.html  # WebUI前端挂载：改完重启容器即生效
      - ./webui_token.txt:/app/webui_token.txt  # WebUI令牌文件（忘记令牌时在项目目录查看）
      # 统计数据（主程序写 stats.json，供仪表盘展示；bot-data 卷与 qq-bot 共用）
      - bot-data:/data
    networks:
      - qqbot

volumes:
  napcat-data:
  napcat-config:
  napcat-qqdata:
  bot-data:
  model-cache:
  # 可选：解析服务的媒体卷（解析栈用项目名 dtk 启动后卷名为 dtk_media-data）
  # 想直接读文件就取消注释，并把上面 qqbot 的 dtk-media 挂载也取消注释
  # dtk-media:
  #   external: true
  #   name: dtk_media-data

networks:
  qqbot:
  dtk_data:
    external: true
    name: dtk_data
