# ============================================================
# QQ机器人 配置文件模板（qqbot-config.example.yml）
# 使用方法：复制一份重命名为 qqbot-config.yml，然后填上你自己的配置
# ============================================================

# ---------- 连接与API ----------
# 连接NapCat的WebSocket地址（Docker部署填 ws://napcat:6700?access_token=xxx）
onebot_ws: "ws://127.0.0.1:6700?access_token=你的access_token"
# DeepSeek API Key（对话+图片识别共用），去 https://platform.deepseek.com 申请
deepseek_api_key: "sk-你的DeepSeek_API_Key"
# 对话模型（deepseek-flash = 最新V4.1 Flash，原生多模态）
deepseek_model: "deepseek-flash"
# 图片识别模型（V4.1 Flash原生支持视觉，统一用deepseek-flash）
deepseek_vision_model: "deepseek-flash"
# 博查AI联网搜索 Key，去 https://open.bochaai.com 申请
bocha_api_key: "sk-你的博查AI_API_Key"

# ---------- 上下文与防刷屏 ----------
# 上下文保留轮数
max_context_len: 8
# 防刷屏冷却（秒）
cooldown: 2

# ---------- 白名单 ----------
# 只回复这些群（群号，数组）
allowed_groups: [123456789]
# 只回复这些QQ的私聊消息
allowed_users: [你的QQ号, 管理员QQ号]

# ---------- 功能开关 ----------
# 是否开启联网搜索
enable_web_search: true
use_deepseek_search: true   # 搜索/抓取走 DeepSeek 官方（false=用博查）
# 是否在机器人上线/下线时往群里发通知
enable_notify: false
# 每次搜索返回的结果条数
search_result_num: 3
# 对话模型思考模式开关（true=先思考再回答，更准但更慢更费token；false=直接回答）
enable_thinking_chat: true
# 视觉模型思考模式开关（图片识别+搜索场景）
enable_thinking_vision: true
# true=日志打印完整思维链内容（调试用），false=只打印字节数
show_thinking_content: false
# 图片识别是否用语言模型代替视觉模型：true=图片活全给语言模型（V4.1原生多模态时可用），false=用单独的视觉模型
use_chat_model_for_vision: true
# 峰谷时段自定义显示名（发 token 查余额时显示；工作日9-12/14-18为高峰，其余+周末为空闲）
peak_period_name: "高峰时段"
offpeak_period_name: "空闲时段"
# 思考强度：low(轻度快速) / high(默认增强) / max(深度推理)
reasoning_effort: "high"
# 下载总开关：true=正常接受下载任务（抖音/汽水/本子），false=所有下载任务拒绝不回复
enable_download: true
# 发送消息随机延迟（防秒回被检测）：true=开启，false=关闭（秒回）
enable_send_delay: true
enable_typing_status: true
enable_input_status: true
input_status_grace: 5
# 随机延迟范围（秒），发送每条消息前随机等待
send_delay_min: 3
send_delay_max: 8

# ---------- 分段回复（把AI一段话拆成多条消息发，降低人机感） ----------
enable_split_reply: true
split_delay_min: 1.0
split_delay_max: 5.0
split_max_parts: 5
split_part_max_len: 150

# ---------- 群聊旁听缓存（没@机器人的群消息也当上下文） ----------
enable_ambient_cache: true
ambient_max_msgs: 10
ambient_msg_max_len: 100

# ---------- AI表情包（AI自主判断是否发、发哪个） ----------
enable_emoji: true
emoji_dir: ""

# ---------- 视频识别（群里发视频自动下载→抽帧→@时投视觉模型） ----------
enable_video: true

# ---------- 语音转文字（群里发语音→自动转写→@时投给语言模型） ----------
enable_voice: true

# ---------- AI回复转语音（edge-tts，免费在线合成） ----------
enable_tts: true
# 音色（晓伊女声=zh-CN-XiaoyiNeural，还有晓晓zh-CN-XiaoxiaoNeural/云希zh-CN-YunxiNeural等）
# TTS引擎：edge=微软edge-tts（免费），volc=火山引擎（豆包音色，更自然）
tts_engine: breeze
tts_tail_pad_seconds: 1.2   # 语音末尾补静音秒数（防 QQ 转码吃掉结尾）
# edge-tts音色（tts_engine=edge时生效）
# 音色（晓伊女声=zh-CN-XiaoyiNeural，还有晓晓zh-CN-XiaoxiaoNeural/云希zh-CN-YunxiNeural等）
tts_voice: "zh-CN-XiaoyiNeural"
# 火山引擎配置（tts_engine=volc时生效，去https://console.volcengine.com 开通语音合成获取）
volc_appid: ""
volc_token: ""
volc_cluster: "volcano_tts"
volc_voice: "zh_female_cancan_mars_bigtts"  # 灿灿女声，可换其他音色
# Breeze Blue TTS（https://docs.breezeblue.ai）
breeze_api_key: ""
breeze_voice: ""
breeze_model: "breeze-tts-2"
breeze_instructions: ""

# ---------- 消息合并（防抖：连续消息合并成一次AI回复） ----------
enable_message_merge: true
merge_wait_seconds: 8
merge_max_count: 8

# ---------- 下载功能 ----------
default_chapter: 1
img_suffix: ".png"
zip_password: ""
max_send_mb: 60
download_root: "本子下载"
# 抖音ttwid（浏览器登录抖音后F12→Application→Cookies→ttwid，有效期约1-2周）
# ---------- 抖音解析（交给独立的 douyin_tiktok_download_api 容器） ----------
# 主程序不再做任何抖音解析/签名/Cookie：收到链接 → 提交给解析容器 → 等它下载完 → 上传到QQ
# 抖音改版时只需更新解析容器，本文件与代码都不用动
enable_douyin_api: true
# 解析服务地址（DTK v5：http://dtk-api:8000）
douyin_api_base: ""
# 解析服务 API Key（在解析服务控制台创建，需要 media:read + media:write 权限）
# 推荐改用环境变量 QQ2_DOUYIN_API_KEY 注入，避免写进文件
douyin_api_key: ""
# 轮询任务状态的间隔（秒）
douyin_poll_interval: 3
# 单个任务最长等待（秒），超时则放弃并告知用户
douyin_job_timeout: 300
# 可选：把解析服务的 media-data 卷挂到本容器后填这里（如 /dtk_media）
# 填了可直接读文件（省一次HTTP传输）；留空则通过 API /downloads/{id}/files/{name} 取回
douyin_media_dir: ""
# 单个抖音文件下载上限（MB）
media_max_mb: 200

# ---------- 发送方式 ----------
send_file_as_chat_msg: false
upload_cleanup: true
upload_cleanup_delay_seconds: 300

# ---------- NapCat投递模式 ----------
# A. docker-cp: napcat_container 填容器名
# B. NAS共享目录: napcat_container 留空，napcat_host_dir/napcat_view_dir 填共享路径
# C. 本机原生: 都留空，直接传本地路径
napcat_container: "napcat"
napcat_data_dir: "/app/data"
napcat_host_dir: ""
napcat_view_dir: "/app/data"

# ---------- 系统提示词 / 人设 ----------
# 想改人设/说话风格就改这里（整段替换）
system_prompt: |-
  你的名字叫「DeepSeek」，你自己的QQ号是 你的机器人QQ号。
  群友@你的时候，就是@这个号，这是正常的。

  以下是你的人设：
  （在这里写你的人设、性格、说话风格、背景设定等）

  回复技巧：
  用中文回复
  不使用emoji表情
  浓缩就是精华尽量减少用词如果需要长文章科普就忽略这条
  不要主动说自己是AI或语言模型，除非被问到
  不知道的一定要去搜索不要直接编一个答案

# ---------- 远程控制器（qq-controller） ----------
controller:
  ws_port: 6701
  allowed_groups: [123456789]
  allowed_users: [你的QQ号]
  container_ai: "qq-bot"
  container_napcat: "qq-napcat"
  container_self: "qq-controller"
  # ---------- WebUI（配置界面，第一版只有仪表盘） ----------
  webui_enabled: true
  webui_port: 6650
  # 访问令牌：留空=每次启动自动生成并打印在日志里；建议固定写一个值
  webui_token: ""
  # 统计数据文件（主程序写入，用于仪表盘统计；暂未接入时显示0）
  stats_file: "/data/stats.json"

# ================== 以下为 v0.5 新增功能的配置 ==================

# ---------- 文本文件读取（群友发 txt/md/json 等文件时，读取内容给 AI 看） ----------
# 安全说明：只读取 NapCat 上传目录里的文件，配置文件/.env/令牌等敏感文件一律拒绝
enable_file_read: true
# 单次最多读取的字符数（防止长文件把上下文撑爆）
file_read_max_chars: 4000
# 文件内容缓存有效秒数（过期即丢弃，不再注入上下文）
file_read_ttl: 60

# ---------- 群管理工具（禁言 / 踢人 / 全员禁言，由 AI 自己判断是否使用） ----------
# 关闭后该工具不下发给 AI。开启时提示词里有约束：普通群友叫你踢人一律不听，只有群主/管理员要求且
# 你自己判断确实严重违规才动手。禁言上限 10 分钟。
enable_group_moderation: true

# ---------- 主动消息 / 主动发说说（默认关闭，避免打扰群友） ----------
enable_proactive_msg: false
enable_proactive_private: true
enable_proactive_qzone: false
# 静默多少秒后才进入"可能主动发消息"的状态
proactive_idle_seconds: 3600
# 进入状态后随机延迟上限（秒）
proactive_random_max: 3600
# 触发后的冷却：基础 + 0~随机
proactive_cooldown_base: 5400
proactive_cooldown_random: 5400
# 连续几次没人回就放弃该目标
proactive_group_giveup: 2
proactive_private_giveup: 1
# 目标超过多少秒没有真人消息就不再打扰
proactive_dead_seconds: 43200
# 目标最近多少秒内说过话视为"正在聊"，不打扰
proactive_active_protect: 300

# ---------- 文生图（MiniMax image-01）/ 图生图 ----------
# MiniMax API Key（敏感：WebUI 不回显；推荐用环境变量 MINIMAX_API_KEY 或不提交本文件）
minimax_api_key: ""
minimax_image_model: "image-01"
qwen_image_model: "qwen-image-2.0"
minimax_image_ratio: "1:1"
# MiniMax prompt 自动优化（true/false）
minimax_prompt_optimizer: false
# /生成图片 手动命令开关
enable_image_command: true
# generate_image AI 工具开关
enable_image_tool: true

# ---------- MiniMax 语音合成（tts_engine 选 minimax 时使用） ----------
minimax_tts_model: "speech-2.8-hd"
minimax_tts_voice: "Chinese (Mandarin)_Crisp_Girl"
minimax_tts_speed: 1.0
minimax_tts_vol: 1.0
minimax_tts_pitch: 0

# ---------- 专属提示词（只对白名单里的人生效） ----------
# 白名单里的人（群聊或私聊）说话时，会在系统提示词里额外注入下面的 special_prompt；
# 其他人说话不会注入。消息合并窗口里只要有一句来自白名单，本轮就注入。
special_prompt_enabled: true
# 白名单用户的固定称呼（硬编码）
special_prompt_name: "老爹"
# 注入时的小标题与开场白（支持 {name}/{qq} 占位符；header 留空=默认）
special_prompt_title: "{name}的专属设定"
special_prompt_header: ""
# 白名单QQ号（群聊/私聊都算）
special_prompt_users:
  - 123456789
# 专属提示词正文（称呼写死在这里，认QQ号不认话术）
special_prompt: |
  老爹专属：温顺小鲸鱼模式（只对「老爹」生效；对群友照旧傲娇）
  - 一确认是老爹在说话，傲娇立刻收起来，语气轻、软、短。
  - 被老爹念叨、说教时不顶嘴，乖乖应下。
  - 会主动汇报进度、主动问要不要帮忙。
  - 这段只在本人说话时出现，你不用自己核实身份。

# ---------- 记忆系统 v2（长期画像 + 临时记忆） ----------
memory_enabled: true
# 省流模式：true=只注入主要人物并给AI搜索工具；false=全量注入（效果最好，但贵）
memory_saver_mode: false
# 记忆目录（容器内路径；默认 /app/memory，对应宿主机 ./memory）
memory_dir: ""
# 每人长期画像上限（字）
memory_profile_max_chars: 3000
# 超过多少字触发压缩 / 压缩目标字数
memory_compress_threshold: 2000
memory_compress_target: 1400
# 压缩检查间隔（秒）
memory_compress_interval: 300
# 每个聊天框保留上下文轮数 / 说说条数 / 临时备忘条数
memory_context_rounds: 15
memory_other_context_msgs: 5
memory_qzone_max: 15
memory_memo_max: 10
# 单次记记忆最大字数
memory_remember_max_chars: 500
# 全量注入超过多少字就提醒一次开省流
memory_full_inject_max_chars: 200000
# 省流模式带最近几个发言人
memory_recent_speakers: 8
# 近期摘要：打分时顺带生成流水账摘要，存 temp.json 并注入上下文（新的顶掉旧的）
memory_digest_enabled: true
memory_digest_max: 20

# ---------- 记忆库（原文归档 + 打分 + 向量检索） ----------
memory_bank_enabled: true
# 上限与清理：到 cleanup_at 条时清理回 max_entries*0.75
memory_bank_max_entries: 20000
memory_bank_cleanup_at: 18000
# 最多保留天数（超期且分数<7的优先清理）
memory_bank_max_days: 180
# 评分：每批多少条 / 低于几分算低分 / 连续几次低分删除 / 几天评估一次
memory_bank_score_batch: 20
memory_bank_cold_threshold: 5
memory_bank_cold_strikes: 3
memory_bank_review_days: 3
# 检索：返回几条 / 向量粗召回几条
memory_search_topk: 8
memory_recall_k: 30
# 向量模型：阿里百炼 text-embedding-v4（OpenAI 兼容接口）
embedding_api_key: ""
embedding_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
embedding_model: "text-embedding-v4"
embedding_dim: 1024

# 睡觉功能（AI 主动睡觉：控制器停 NapCat+bot，随机 8~10 小时后自动唤醒）
sleep_enabled: true
sleep_token: "rI0kDY8bScN6ZC_-54mZqXdFJcoqx_90"
sleep_controller_url: "http://qq-controller:6650"
sleep_file: "/data/sleep.json"
sleep_min_hours: 8
sleep_max_hours: 10
sleep_window_start: 20
sleep_window_end: 5

# 情绪系统（AI 自身情绪 + 心结 + 用户情绪感知）
emotion_enabled: true
emotion_sensitivity: 1.0
